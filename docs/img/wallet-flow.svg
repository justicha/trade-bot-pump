<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="walletTitle walletDesc">
  <title id="walletTitle">Настройка кошелька: от нуля до dry-run</title>
  <desc id="walletDesc">Четыре шага: создать кошелёк локально, получить файл ключа в папке keys (в git не попадает), пополнить небольшую сумму, сначала запустить dry-run. Отдельно — необязательный шаг live с флагом --live и переменной LIVE_CONFIRM=yes, проверка того, что git не видит ключи, и предупреждение: никому не показывать файл ключа.</desc>
  <defs>
    <linearGradient id="wBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0c1424"/>
    </linearGradient>
    <pattern id="wGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#151f33" stroke-width="1"/>
    </pattern>
    <marker id="wArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
    <filter id="wShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="460" fill="url(#wBg)"/>
  <rect width="1200" height="460" fill="url(#wGrid)" opacity="0.5"/>

  <text x="32" y="40" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6f1ff">Кошелёк: от нуля до dry-run</text>

  <g filter="url(#wShadow)">
    <rect x="32" y="70" width="220" height="96" rx="12" fill="#122238" stroke="#2dd4bf" stroke-width="1.6"/>
    <rect x="286" y="70" width="220" height="96" rx="12" fill="#241a08" stroke="#fbbf24" stroke-width="1.6"/>
    <rect x="540" y="70" width="220" height="96" rx="12" fill="#122238" stroke="#2dd4bf" stroke-width="1.6"/>
    <rect x="794" y="70" width="220" height="96" rx="12" fill="#122238" stroke="#2dd4bf" stroke-width="1.6"/>
    <rect x="32" y="210" width="474" height="88" rx="12" fill="#141d2b" stroke="#3b5578" stroke-width="1.6"/>
    <rect x="540" y="210" width="628" height="88" rx="12" fill="#241a08" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
    <text x="48" y="98" font-size="14" font-weight="600" fill="#dbe7f5">1. Создание</text>
    <text x="48" y="120" font-size="11" fill="#8aa0b8">node lib/wallet.mjs generate</text>
    <text x="48" y="138" font-size="11" fill="#8aa0b8">печатает публичный адрес</text>
    <text x="48" y="156" font-size="11" fill="#6f8299">деньги не нужны</text>

    <text x="302" y="98" font-size="14" font-weight="600" fill="#fbbf24">2. Файл ключа</text>
    <text x="302" y="120" font-size="11" fill="#c9b48a">keys/default.json</text>
    <text x="302" y="138" font-size="11" fill="#c9b48a">массив из 64 чисел</text>
    <text x="302" y="156" font-size="11" fill="#b99a5b">git его не видит</text>

    <text x="556" y="98" font-size="14" font-weight="600" fill="#dbe7f5">3. Пополнение</text>
    <text x="556" y="120" font-size="11" fill="#8aa0b8">немного SOL на адрес</text>
    <text x="556" y="138" font-size="11" fill="#8aa0b8">только отдельный кошелёк</text>
    <text x="556" y="156" font-size="11" fill="#6f8299">не основной</text>

    <text x="810" y="98" font-size="14" font-weight="600" fill="#dbe7f5">4. Сначала dry-run</text>
    <text x="810" y="120" font-size="11" fill="#8aa0b8">npm run sniper</text>
    <text x="810" y="138" font-size="11" fill="#8aa0b8">ничего не подписывается</text>
    <text x="810" y="156" font-size="11" fill="#6f8299">транзакций нет</text>

    <text x="48" y="238" font-size="13.5" font-weight="600" fill="#dbe7f5">Проверьте, что git не видит лишнего</text>
    <text x="48" y="260" font-size="11" fill="#8aa0b8">git ls-files keys — должно быть пусто</text>
    <text x="48" y="278" font-size="11" fill="#8aa0b8">git ls-files .env — тоже пусто</text>

    <text x="556" y="238" font-size="13.5" font-weight="600" fill="#fbbf24">5. Живьём — только осознанно</text>
    <text x="556" y="260" font-size="11" fill="#c9b48a">--live требует LIVE_CONFIRM=yes в той же оболочке; иначе бот остановится до подключения к сети</text>
    <text x="556" y="278" font-size="11" fill="#c9b48a">и только на сумму, которую не страшно потерять целиком</text>
  </g>

  <g stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#wArrow)">
    <path d="M252 118 H 286"/>
    <path d="M506 118 H 540"/>
    <path d="M760 118 H 794"/>
    <path d="M904 166 V 210"/>
  </g>

  <g transform="translate(80,342)">
    <path d="M0 -28 L 28 -17 V 6 C 28 21, 17 30, 0 36 C -17 30, -28 21, -28 6 V -17 Z" fill="#241a08" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="24" font-weight="700" fill="#fbbf24">!</text>
    <text x="54" y="-4" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">Никому не показывайте keys/ и .env</text>
    <text x="54" y="18" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" fill="#c9b48a">Кто получил файл ключа — распоряжается всеми деньгами на этом адресе. Отозвать ключ нельзя.</text>
    <text x="54" y="38" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" fill="#c9b48a">Никаких скриншотов, чатов, облачных дисков и коммитов. Резервная копия — на офлайн-носитель.</text>
  </g>
</svg>
