<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="gradTitle gradDesc">
  <title id="gradTitle">Схема graduation-снайпера</title>
  <desc id="gradDesc">Поток bots/graduation-sniper/graduation.mjs: реальное заполнение кривой, число держателей, предварительная проверка выхода, симуляция и покупка, цена входа из сделки, затем take profit или stop loss или таймаут, продажа частями в пределах реальных резервов, ограниченные повторы, состояние STUCK и отдельный путь PumpSwap.</desc>
  <defs>
    <linearGradient id="grBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0c1424"/>
    </linearGradient>
    <pattern id="grGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#151f33" stroke-width="1"/>
    </pattern>
    <marker id="grArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
    <filter id="grShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="url(#grBg)"/>
  <rect width="1200" height="620" fill="url(#grGrid)" opacity="0.5"/>

  <text x="32" y="40" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6f1ff">graduation.mjs — заполнение по реальным резервам, ограниченные выходы</text>

  <g filter="url(#grShadow)">
    <rect x="32" y="64" width="266" height="64" rx="12" fill="#141d2b" stroke="#3b5578" stroke-width="1.6"/>
    <rect x="32" y="144" width="266" height="78" rx="12" fill="#122238" stroke="#2dd4bf" stroke-width="1.6"/>
    <rect x="32" y="238" width="266" height="64" rx="12" fill="#122238" stroke="#2dd4bf" stroke-width="1.6"/>
    <rect x="32" y="318" width="266" height="78" rx="12" fill="#122238" stroke="#2dd4bf" stroke-width="1.6"/>
    <rect x="32" y="412" width="266" height="64" rx="12" fill="#241a08" stroke="#fbbf24" stroke-width="2"/>
    <rect x="32" y="492" width="266" height="64" rx="12" fill="#141d2b" stroke="#3b5578" stroke-width="1.6"/>
    <rect x="340" y="144" width="240" height="78" rx="12" fill="#141d2b" stroke="#3b5578" stroke-width="1.6"/>
    <rect x="340" y="238" width="240" height="64" rx="12" fill="#141d2b" stroke="#3b5578" stroke-width="1.6"/>
    <rect x="340" y="318" width="240" height="78" rx="12" fill="#141d2b" stroke="#3b5578" stroke-width="1.6"/>
    <rect x="612" y="492" width="252" height="64" rx="12" fill="#122238" stroke="#2dd4bf" stroke-width="1.6"/>
    <rect x="612" y="412" width="252" height="64" rx="12" fill="#241a08" stroke="#fbbf24" stroke-width="1.6"/>
    <rect x="612" y="318" width="252" height="64" rx="12" fill="#122238" stroke="#2dd4bf" stroke-width="1.6"/>
    <rect x="612" y="224" width="252" height="64" rx="12" fill="#1d1408" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="6 5"/>
    <rect x="612" y="130" width="252" height="64" rx="12" fill="#141d2b" stroke="#3b5578" stroke-width="1.6"/>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
    <text x="48" y="92" font-size="14" font-weight="600" fill="#dbe7f5">Покупка на кривой</text>
    <text x="48" y="114" font-size="11.5" fill="#8aa0b8">резервы из события сделки</text>

    <text x="48" y="172" font-size="14" font-weight="600" fill="#dbe7f5">Реальное заполнение</text>
    <text x="48" y="194" font-size="11.5" fill="#8aa0b8">rSol / 85 SOL × 100</text>
    <text x="48" y="212" font-size="11.5" fill="#8aa0b8">MIN_FILL 92 … MAX_FILL 97</text>

    <text x="48" y="266" font-size="14" font-weight="600" fill="#dbe7f5">Держатели из потока</text>
    <text x="48" y="288" font-size="11.5" fill="#8aa0b8">MIN_HOLDERS (7) разных</text>

    <text x="48" y="346" font-size="14" font-weight="600" fill="#dbe7f5">Проверка выхода</text>
    <text x="48" y="368" font-size="11.5" fill="#8aa0b8">обратный путь ≥ EXIT_MIN_RATIO (0.9)</text>
    <text x="48" y="386" font-size="11.5" fill="#8aa0b8">и кривая может выплатить</text>

    <text x="48" y="440" font-size="14" font-weight="600" fill="#fbbf24">Симуляция → покупка</text>
    <text x="48" y="462" font-size="10.5" fill="#c9b48a">GRAD_BUY_SOL · BUY_SLIPPAGE_BPS · лимиты</text>

    <text x="48" y="520" font-size="14" font-weight="600" fill="#dbe7f5">Цена входа</text>
    <text x="48" y="542" font-size="10.5" fill="#8aa0b8">факт: сколько SOL ушло и токенов пришло</text>

    <text x="356" y="172" font-size="13.5" font-weight="600" fill="#dbe7f5">Пропуск: вне коридора</text>
    <text x="356" y="194" font-size="11" fill="#8aa0b8">слишком рано</text>
    <text x="356" y="210" font-size="11" fill="#8aa0b8">или последние % до миграции</text>

    <text x="356" y="266" font-size="13.5" font-weight="600" fill="#dbe7f5">Пропуск: мало держателей</text>
    <text x="356" y="288" font-size="11" fill="#8aa0b8">со временем может дорости</text>

    <text x="356" y="346" font-size="13.5" font-weight="600" fill="#dbe7f5">Пропуск: выход в минус</text>
    <text x="356" y="368" font-size="11" fill="#8aa0b8">в журнал с exitRatio</text>
    <text x="356" y="384" font-size="11" fill="#8aa0b8">и причиной</text>

    <text x="628" y="520" font-size="13.5" font-weight="600" fill="#dbe7f5">TP / SL / таймаут</text>
    <text x="628" y="542" font-size="11" fill="#8aa0b8">TP 1.5 · SL 0.7 · таймаут 300 с</text>

    <text x="628" y="440" font-size="13.5" font-weight="600" fill="#fbbf24">План продажи</text>
    <text x="628" y="462" font-size="11" fill="#c9b48a">части ≤ 0.95 × реальных резервов</text>

    <text x="628" y="346" font-size="13.5" font-weight="600" fill="#dbe7f5">Симуляция → отправка</text>
    <text x="628" y="368" font-size="10.5" fill="#8aa0b8">до 3 попыток: 500 → 1000 → 2000 bps</text>

    <text x="628" y="252" font-size="13.5" font-weight="600" fill="#fbbf24">STUCK</text>
    <text x="628" y="274" font-size="11" fill="#c9b48a">стоп повторов · alert в сводке</text>

    <text x="628" y="158" font-size="13.5" font-weight="600" fill="#dbe7f5">Путь PumpSwap</text>
    <text x="628" y="180" font-size="10.5" fill="#8aa0b8">LIVE_CONFIRM_AMM=yes (не проверен)</text>
  </g>

  <g stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#grArrow)">
    <path d="M165 128 V 144"/>
    <path d="M165 222 V 238"/>
    <path d="M165 302 V 318"/>
    <path d="M165 396 V 412"/>
    <path d="M165 476 V 492"/>
    <path d="M298 183 H 340"/>
    <path d="M298 270 H 340"/>
    <path d="M298 357 H 340"/>
    <path d="M580 524 H 612"/>
    <path d="M738 492 V 476"/>
    <path d="M738 412 V 382"/>
    <path d="M738 318 V 288"/>
    <path d="M738 224 V 194"/>
  </g>

  <text x="32" y="592" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#8aa0b8">Итог сессии: Ctrl+C закрывает позиции, печатает сводку (баланс кошелька, комиссии неудачных транзакций, список STUCK) и снимает замок.</text>
  <text x="32" y="612" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="11" fill="#6f8299">Позицию из STUCK закрывают вручную: scripts/rescue-sell.mjs. Полные имена переменных (GRAD_*, BUY_SLIPPAGE_BPS, LIVE_CONFIRM_AMM) — в docs/bots.md.</text>
</svg>

