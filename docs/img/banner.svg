<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">pump-bot — баннер проекта</title>
  <desc id="bannerDesc">Тёмно-синий баннер: бирюзовая кривая bonding curve с градиентом и мягким свечением уходит вправо и выравнивается, янтарная точка отмечает вход, круглый жёлтый значок с буквой p. Заголовок pump-bot, подзаголовок «боты для pump.fun на Solana, сначала dry-run» и два бейджа: «DRY-RUN по умолчанию» и «исследовательский инструмент».</desc>
  <defs>
    <linearGradient id="bgFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0c1626"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="curveStroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="curveArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#1a2b45" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bgFill)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.75"/>
  <circle cx="980" cy="150" r="250" fill="url(#tealGlow)"/>

  <path d="M470 248 C 620 248, 690 216, 800 170 S 1010 96, 1100 92 C 1160 90, 1200 94, 1244 98 L 1244 264 L 470 264 Z" fill="url(#curveArea)"/>
  <path d="M470 248 C 620 248, 690 216, 800 170 S 1010 96, 1100 92 C 1160 90, 1200 94, 1244 98" fill="none" stroke="url(#curveStroke)" stroke-width="6" stroke-linecap="round" filter="url(#softGlow)"/>

  <g fill="#0b1220" stroke="#2dd4bf" stroke-width="3">
    <circle cx="800" cy="170" r="7"/>
    <circle cx="1100" cy="92" r="7"/>
  </g>
  <g fill="#2dd4bf">
    <circle cx="800" cy="170" r="3"/>
    <circle cx="1100" cy="92" r="3"/>
  </g>
  <circle cx="978" cy="135" r="6" fill="#fbbf24"/>

  <circle cx="1140" cy="222" r="30" fill="#131f33" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="1140" y="233" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="30" font-weight="700" fill="#fbbf24">p</text>

  <text x="64" y="124" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="62" font-weight="800" fill="#e6f1ff" letter-spacing="-1">pump-bot</text>
  <text x="66" y="164" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="20" fill="#9fb3c8">боты для pump.fun на Solana · сначала dry-run</text>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="64" y="196" width="232" height="34" rx="17" fill="#0e2a28" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="180" y="218" text-anchor="middle" fill="#5eead4">DRY-RUN по умолчанию</text>
    <rect x="312" y="196" width="292" height="34" rx="17" fill="#241a08" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="458" y="218" text-anchor="middle" fill="#fbbf24">исследовательский инструмент</text>
  </g>

  <text x="64" y="272" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#7f93a8">не финансовый совет · прибыль не гарантирована</text>
</svg>
