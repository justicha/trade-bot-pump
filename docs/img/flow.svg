<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">How the bot works: five steps</title>
  <desc id="flowDesc">Five cards left to right: watching for new tokens, filters and limits, a buy in dry-run or live (highlighted amber), an exit on take profit, stop loss or timeout, the journal and summary. Arrows show the step order.</desc>
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0d1728"/>
    </linearGradient>
    <pattern id="flowGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#16243a" stroke-width="1"/>
    </pattern>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#flowBg)"/>
  <rect width="1200" height="280" fill="url(#flowGrid)" opacity="0.6"/>

  <text x="40" y="46" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="21" font-weight="700" fill="#e6f1ff">How it works</text>
  <text x="40" y="70" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13" fill="#8aa0b8">five steps, the same order for every token</text>

  <g filter="url(#cardShadow)">
    <rect x="40" y="96" width="192" height="120" rx="14" fill="#122238" stroke="#2dd4bf" stroke-width="1.75"/>
    <rect x="272" y="96" width="192" height="120" rx="14" fill="#122238" stroke="#2dd4bf" stroke-width="1.75"/>
    <rect x="504" y="96" width="192" height="120" rx="14" fill="#241a08" stroke="#fbbf24" stroke-width="2"/>
    <rect x="736" y="96" width="192" height="120" rx="14" fill="#122238" stroke="#2dd4bf" stroke-width="1.75"/>
    <rect x="968" y="96" width="192" height="120" rx="14" fill="#122238" stroke="#2dd4bf" stroke-width="1.75"/>
  </g>

  <g fill="none" stroke="#2dd4bf" stroke-width="1.5">
    <circle cx="66" cy="122" r="12"/>
    <circle cx="298" cy="122" r="12"/>
    <circle cx="822" cy="122" r="12"/>
    <circle cx="1054" cy="122" r="12"/>
  </g>
  <circle cx="530" cy="122" r="12" fill="none" stroke="#fbbf24" stroke-width="1.5"/>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <text x="66" y="126" fill="#2dd4bf">1</text>
    <text x="298" y="126" fill="#2dd4bf">2</text>
    <text x="530" y="126" fill="#fbbf24">3</text>
    <text x="822" y="126" fill="#2dd4bf">4</text>
    <text x="1054" y="126" fill="#2dd4bf">5</text>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" text-anchor="middle">
    <text x="136" y="158" font-size="17" font-weight="600" fill="#e6f1ff">Watch</text>
    <text x="136" y="182" font-size="13" fill="#9fb3c8">new tokens</text>
    <text x="136" y="201" font-size="11" fill="#6f8299">WebSocket pump.fun</text>

    <text x="368" y="158" font-size="17" font-weight="600" fill="#e6f1ff">Filters</text>
    <text x="368" y="182" font-size="13" fill="#9fb3c8">and limits</text>
    <text x="368" y="201" font-size="11" fill="#6f8299">holders · amount · pause</text>

    <text x="600" y="158" font-size="17" font-weight="600" fill="#fbbf24">Buy</text>
    <text x="600" y="182" font-size="13" fill="#e8c37a">dry-run or live</text>
    <text x="600" y="201" font-size="11" fill="#b99a5b">two switches</text>

    <text x="832" y="158" font-size="17" font-weight="600" fill="#e6f1ff">Exit</text>
    <text x="832" y="182" font-size="13" fill="#9fb3c8">TP · SL · timeout</text>
    <text x="832" y="201" font-size="11" fill="#6f8299">by price or by time</text>

    <text x="1064" y="158" font-size="17" font-weight="600" fill="#e6f1ff">Journal</text>
    <text x="1064" y="182" font-size="13" fill="#9fb3c8">and summary</text>
    <text x="1064" y="201" font-size="11" fill="#6f8299">data/journal/*.jsonl</text>
  </g>

  <g stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#flowArrow)" stroke-linecap="round">
    <path d="M236 156 H 264"/>
    <path d="M468 156 H 496"/>
    <path d="M700 156 H 728"/>
    <path d="M932 156 H 960"/>
  </g>

  <text x="40" y="252" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#8aa0b8">In dry-run the third step signs and sends nothing: the bot only records what it would buy.</text>
</svg>
