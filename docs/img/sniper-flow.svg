<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="sniperTitle sniperDesc">
  <title id="sniperTitle">Sniper flow diagram</title>
  <desc id="sniperDesc">The bots/sniper/sniper.mjs flow: token creation, the author's first-buy filter, waiting for holders, the crowd check, pause and slots, the buy, then exit polling and a sell on take profit, stop loss or timeout, a journal record and the session summary.</desc>
  <defs>
    <linearGradient id="snBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0c1424"/>
    </linearGradient>
    <pattern id="snGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#151f33" stroke-width="1"/>
    </pattern>
    <marker id="snArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
    <filter id="snShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="url(#snBg)"/>
  <rect width="1200" height="620" fill="url(#snGrid)" opacity="0.5"/>

  <text x="32" y="40" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6f1ff">sniper.mjs — decision order (the captions name variables)</text>

  <g filter="url(#snShadow)">
    <rect x="32" y="64" width="266" height="64" rx="12" fill="#141d2b" stroke="#3b5578" stroke-width="1.6"/>
    <rect x="32" y="144" width="266" height="64" rx="12" fill="#122238" stroke="#2dd4bf" stroke-width="1.6"/>
    <rect x="32" y="224" width="266" height="78" rx="12" fill="#122238" stroke="#2dd4bf" stroke-width="1.6"/>
    <rect x="32" y="318" width="266" height="64" rx="12" fill="#122238" stroke="#2dd4bf" stroke-width="1.6"/>
    <rect x="32" y="398" width="266" height="64" rx="12" fill="#122238" stroke="#2dd4bf" stroke-width="1.6"/>
    <rect x="32" y="478" width="266" height="64" rx="12" fill="#241a08" stroke="#fbbf24" stroke-width="2"/>
    <rect x="340" y="224" width="240" height="78" rx="12" fill="#141d2b" stroke="#3b5578" stroke-width="1.6"/>
    <rect x="340" y="398" width="240" height="64" rx="12" fill="#141d2b" stroke="#3b5578" stroke-width="1.6"/>
    <rect x="340" y="478" width="240" height="64" rx="12" fill="#241a08" stroke="#fbbf24" stroke-width="1.6"/>
    <rect x="612" y="478" width="252" height="64" rx="12" fill="#122238" stroke="#2dd4bf" stroke-width="1.6"/>
    <rect x="612" y="398" width="252" height="64" rx="12" fill="#141d2b" stroke="#3b5578" stroke-width="1.6"/>
    <rect x="612" y="318" width="252" height="64" rx="12" fill="#141d2b" stroke="#3b5578" stroke-width="1.6"/>
    <rect x="612" y="238" width="252" height="64" rx="12" fill="#241a08" stroke="#fbbf24" stroke-width="1.6"/>
    <rect x="612" y="158" width="252" height="64" rx="12" fill="#141d2b" stroke="#3b5578" stroke-width="1.6"/>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
    <text x="48" y="92" font-size="14" font-weight="600" fill="#dbe7f5">Token creation</text>
    <text x="48" y="114" font-size="11.5" fill="#8aa0b8">Create / CreateV2 in the logs</text>

    <text x="48" y="172" font-size="14" font-weight="600" fill="#dbe7f5">First-buy filter</text>
    <text x="48" y="194" font-size="11.5" fill="#8aa0b8">SNIPER_MIN_DEV_BUY (0 = off)</text>

    <text x="48" y="252" font-size="14" font-weight="600" fill="#dbe7f5">Holders</text>
    <text x="48" y="274" font-size="11.5" fill="#8aa0b8">SNIPER_MIN_HOLDERS distinct wallets</text>
    <text x="48" y="292" font-size="11.5" fill="#8aa0b8">within SNIPER_HOLDER_WAIT_SEC</text>

    <text x="48" y="346" font-size="14" font-weight="600" fill="#dbe7f5">Crowd check</text>
    <text x="48" y="368" font-size="10.5" fill="#8aa0b8">SNIPER_MIN_SLOTS · SNIPER_MIN_DELAY_MS</text>

    <text x="48" y="426" font-size="14" font-weight="600" fill="#dbe7f5">Pause and slots</text>
    <text x="48" y="448" font-size="10" fill="#8aa0b8">SNIPER_COOLDOWN_SEC · SNIPER_MAX_POSITIONS</text>

    <text x="48" y="506" font-size="14" font-weight="600" fill="#fbbf24">Buy</text>
    <text x="48" y="528" font-size="11.5" fill="#c9b48a">SNIPER_BUY_SOL · session limits</text>

    <text x="356" y="252" font-size="13.5" font-weight="600" fill="#dbe7f5">No: token dropped</text>
    <text x="356" y="274" font-size="11" fill="#8aa0b8">no money spent,</text>
    <text x="356" y="290" font-size="11" fill="#8aa0b8">one line in the journal</text>

    <text x="356" y="426" font-size="13.5" font-weight="600" fill="#dbe7f5">Skip: not now</text>
    <text x="356" y="448" font-size="11" fill="#8aa0b8">pause or position limit</text>

    <text x="356" y="506" font-size="13.5" font-weight="600" fill="#fbbf24">Position open</text>
    <text x="356" y="528" font-size="11" fill="#c9b48a">entry price — from the trade</text>

    <text x="628" y="506" font-size="13.5" font-weight="600" fill="#dbe7f5">Exit polling</text>
    <text x="628" y="528" font-size="11" fill="#8aa0b8">POLL_MS 3000 ms: TP · SL · timeout</text>

    <text x="628" y="426" font-size="13.5" font-weight="600" fill="#dbe7f5">Exit rules</text>
    <text x="628" y="448" font-size="11" fill="#8aa0b8">TP 1.5 · SL 0.7 · timeout 300 s</text>

    <text x="628" y="346" font-size="13.5" font-weight="600" fill="#dbe7f5">Sell and journal</text>
    <text x="628" y="368" font-size="11" fill="#8aa0b8">record the result → the loss counter</text>

    <text x="628" y="266" font-size="13.5" font-weight="600" fill="#fbbf24">Session summary</text>
    <text x="628" y="288" font-size="11" fill="#c9b48a">MAX_SESSION_SOL · MAX_CONSEC_LOSSES</text>

    <text x="628" y="186" font-size="13.5" font-weight="600" fill="#dbe7f5">Closing positions</text>
    <text x="628" y="208" font-size="11" fill="#8aa0b8">manual stop, then SESSION SUMMARY</text>
  </g>

  <g stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#snArrow)">
    <path d="M165 128 V 144"/>
    <path d="M165 208 V 224"/>
    <path d="M165 302 V 318"/>
    <path d="M165 382 V 398"/>
    <path d="M165 462 V 478"/>
    <path d="M298 263 H 340"/>
    <path d="M298 430 H 340"/>
    <path d="M580 510 H 612"/>
    <path d="M738 478 V 462"/>
    <path d="M738 398 V 382"/>
    <path d="M738 318 V 302"/>
    <path d="M738 238 V 222"/>
  </g>

  <text x="32" y="592" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#8aa0b8">In dry-run the path is the same, but a virtual trade replaces the transaction. The lock file stops two snipers from running on one journal folder.</text>
  <text x="32" y="612" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="11" fill="#6f8299">Full names: SNIPER_TAKE_PROFIT, SNIPER_STOP_LOSS, SNIPER_TIMEOUT_SEC, SNIPER_MAX_SEC, POLL_MS — in docs/bots.md.</text>
</svg>

