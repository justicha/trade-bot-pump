<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
  <title id="t">pump-bot architecture</title>
  <desc id="d">Data flow from Solana RPC and WebSocket through the websocket client, RPC layer and event parser into the bots, then through transaction building to signed transactions sent back to the RPC, with guards, logger and journal modules at the side.</desc>
  <rect width="1200" height="700" fill="#0f1724"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
    <style>
      .box { fill:#16243a; stroke:#2dd4bf; stroke-width:2; rx:10; }
      .box2 { fill:#1b1a10; stroke:#fbbf24; stroke-width:2; rx:10; }
      .box3 { fill:#151d2b; stroke:#3b5578; stroke-width:2; rx:10; }
      .lbl { font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; font-size:15px; fill:#dbe7f5; }
      .small { font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; font-size:12px; fill:#8aa0b8; }
      .hd { font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; font-size:20px; font-weight:700; fill:#e6f1ff; }
      .edge { stroke:#2dd4bf; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .edge2 { stroke:#fbbf24; stroke-width:2; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <text x="40" y="46" class="hd">pump-bot — module map (verified against lib/ and bots/)</text>

  <rect x="40" y="80" width="230" height="86" class="box3"/>
  <text x="56" y="110" class="lbl">Solana RPC (HTTP)</text>
  <text x="56" y="132" class="small">RPC_URL / WS_URL from .env</text>
  <text x="56" y="150" class="small">lib/config.mjs · lib/rpc.mjs</text>

  <rect x="40" y="190" width="230" height="86" class="box3"/>
  <text x="56" y="220" class="lbl">Solana WebSocket</text>
  <text x="56" y="242" class="small">logsSubscribe (pump.fun)</text>
  <text x="56" y="260" class="small">lib/ws.mjs</text>

  <rect x="330" y="80" width="240" height="86" class="box"/>
  <text x="346" y="110" class="lbl">RPC layer</text>
  <text x="346" y="132" class="small">rate limiter + backoff</text>
  <text x="346" y="150" class="small">lib/rpc.mjs · lib/ratelimit.mjs</text>

  <rect x="330" y="190" width="240" height="86" class="box"/>
  <text x="346" y="220" class="lbl">Event parser</text>
  <text x="346" y="242" class="small">trade/create payloads, offsets</text>
  <text x="346" y="260" class="small">lib/events.mjs · lib/mayhem.mjs</text>

  <rect x="330" y="300" width="240" height="86" class="box2"/>
  <text x="346" y="330" class="lbl">State &amp; math</text>
  <text x="346" y="352" class="small">curve, fees, holders, sells</text>
  <text x="346" y="370" class="small">lib/curve.mjs · lib/fees.mjs · lib/sell-plan.mjs</text>

  <rect x="330" y="410" width="240" height="86" class="box"/>
  <text x="346" y="440" class="lbl">Bots</text>
  <text x="346" y="462" class="small">monitor · sniper · graduation-sniper</text>
  <text x="346" y="480" class="small">copy-trader · basic-trader · analytics · volume-analyzer</text>

  <rect x="640" y="410" width="230" height="86" class="box2"/>
  <text x="656" y="440" class="lbl">Transaction builder</text>
  <text x="656" y="462" class="small">compute budget + ix</text>
  <text x="656" y="480" class="small">lib/tx.mjs · lib/pumpfun.mjs · lib/pumpswap.mjs</text>

  <rect x="640" y="300" width="230" height="86" class="box"/>
  <text x="656" y="330" class="lbl">Simulate → send</text>
  <text x="656" y="352" class="small">simulateTx then broadcast</text>
  <text x="656" y="370" class="small">lib/exec.mjs · lib/send.mjs</text>

  <rect x="640" y="190" width="230" height="86" class="box2"/>
  <text x="656" y="220" class="lbl">Signed transaction</text>
  <text x="656" y="242" class="small">wallet keypair (local file)</text>
  <text x="656" y="260" class="small">lib/wallet.mjs</text>

  <rect x="920" y="190" width="230" height="86" class="box3"/>
  <text x="936" y="220" class="lbl">Solana RPC (send)</text>
  <text x="936" y="242" class="small">sendRawTransaction</text>
  <text x="936" y="260" class="small">confirmTransaction</text>

  <rect x="920" y="360" width="230" height="70" class="box"/>
  <text x="936" y="388" class="lbl">Guards</text>
  <text x="936" y="410" class="small">MAX_TRADE_SOL · MAX_SESSION_SOL · MAX_CONSEC_LOSSES</text>

  <rect x="920" y="450" width="230" height="70" class="box"/>
  <text x="936" y="478" class="lbl">Logger (masking)</text>
  <text x="936" y="500" class="small">lib/logger.mjs</text>

  <rect x="920" y="540" width="230" height="70" class="box"/>
  <text x="936" y="568" class="lbl">Journal</text>
  <text x="936" y="590" class="small">data/journal/*.jsonl · lib/journal.mjs</text>

  <path d="M270 123 H 330" class="edge"/>
  <path d="M270 233 H 330" class="edge"/>
  <path d="M450 166 V 190" class="edge"/>
  <path d="M450 276 V 300" class="edge"/>
  <path d="M450 386 V 410" class="edge"/>
  <path d="M570 453 H 640" class="edge2"/>
  <path d="M755 410 V 386" class="edge2"/>
  <path d="M755 300 V 276" class="edge2"/>
  <path d="M870 233 H 920" class="edge"/>
  <path d="M1035 276 V 360" class="edge"/>
  <text x="660" y="140" class="small">reads: accounts, curve state, holders</text>
  <text x="660" y="160" class="small">writes: one journal line per event/trade</text>
  <text x="40" y="660" class="small">Solid teal = data in. Amber = value computed or a transaction path. Only LIVE builds and signs a transaction.</text>
</svg>
